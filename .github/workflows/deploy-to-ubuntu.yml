name: Spring Boot -> Ubuntu Server 무중단 배포 (Blue-Green)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 + Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dandylsj/cookgenie:ubuntu
          provenance: false

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, ubuntu-server]
    environment: ubuntu

    steps:
      - name: GHCR 로그인 (PAT 사용)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: 환경 변수 파일(.env) 생성
        run: |
          rm -f .env
          touch .env
          echo "DB_HOST=mysql-server" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_NAME=cookgenie" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "SPRING_JPA_HIBERNATE_DDL_AUTO=update" >> .env
          echo "TZ=Asia/Seoul" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "SPRING_JPA_SHOW_SQL=false" >> .env
          echo "SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=false" >> .env
          echo "SERVER_SHUTDOWN=graceful" >> .env
          echo "SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s" >> .env
          echo "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health" >> .env

      - name: Docker 네트워크 및 인프라 컨테이너 연결 확인
        run: |
          docker network inspect cookgenie >/dev/null 2>&1 || docker network create cookgenie

          # hatoo와 공유하는 기존 mysql-server 컨테이너를 cookgenie 네트워크에도 연결
          if ! docker inspect mysql-server --format '{{json .NetworkSettings.Networks}}' 2>/dev/null | grep -q '"cookgenie"'; then
            docker network connect cookgenie mysql-server 2>/dev/null || true
          fi

      - name: Nginx 설정 파일 준비
        run: |
          mkdir -p $HOME/cookgenie-nginx/conf.d

          cat > $HOME/cookgenie-nginx/nginx.conf << 'EOF'
          events { worker_connections 1024; }
          http {
              include /etc/nginx/conf.d/*.conf;
              client_max_body_size 50m;
              server {
                  listen 80;
                  location / {
                      proxy_pass http://cookgenie_app;
                      proxy_http_version 1.1;
                      proxy_set_header Connection "";
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_read_timeout 60s;
                      proxy_connect_timeout 10s;
                  }
              }
          }
          EOF

      - name: 블루/그린 무중단 배포
        run: |
          IMAGE="ghcr.io/dandylsj/cookgenie:ubuntu"

          # ── 1. 현재 활성 색상 확인 ──
          if docker ps --filter "name=cookgenie-blue" --format "{{.Names}}" | grep -q "cookgenie-blue"; then
            ACTIVE_COLOR="blue"
            NEW_COLOR="green"
          elif docker ps --filter "name=cookgenie-green" --format "{{.Names}}" | grep -q "cookgenie-green"; then
            ACTIVE_COLOR="green"
            NEW_COLOR="blue"
          else
            ACTIVE_COLOR=""
            NEW_COLOR="blue"
          fi

          echo "현재 활성: ${ACTIVE_COLOR:-없음(최초 배포)}, 신규 배포: $NEW_COLOR"

          # 이전 배포에서 남은 NEW_COLOR 컨테이너 제거
          docker rm -f cookgenie-$NEW_COLOR 2>/dev/null || true

          # ── 2. 새 이미지 pull ──
          docker pull $IMAGE

          # ── 3. 새 컨테이너 시작 (포트 노출 없이 내부 네트워크만) ──
          docker run -d \
            --name cookgenie-$NEW_COLOR \
            --network cookgenie \
            --restart always \
            --env-file .env \
            $IMAGE

          echo "cookgenie-$NEW_COLOR 컨테이너 시작됨"

          # ── 4. 헬스체크 (최대 90초 대기) ──
          CONTAINER_IP=$(docker inspect --format='{{.NetworkSettings.Networks.cookgenie.IPAddress}}' cookgenie-$NEW_COLOR)
          HEALTH_URL="http://$CONTAINER_IP:8080/actuator/health"
          echo "헬스체크 URL: $HEALTH_URL"

          HEALTH_OK=false
          for i in $(seq 1 18); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ 헬스체크 통과 (${i}번째 시도, ${i}*5초 경과)"
              HEALTH_OK=true
              break
            fi
            echo "대기 중... (${i}/18, 상태: $HTTP_STATUS)"
            sleep 5
          done

          if [ "$HEALTH_OK" = "false" ]; then
            echo "❌ 헬스체크 실패 - 헬스 응답:"
            curl -s $HEALTH_URL || true
            echo ""
            echo "❌ 컨테이너 ERROR 로그:"
            docker logs cookgenie-$NEW_COLOR 2>&1 | grep -E "ERROR|Exception|Caused by|FATAL" | head -30
            echo ""
            echo "❌ 컨테이너 시작 로그 (처음 80줄):"
            docker logs cookgenie-$NEW_COLOR 2>&1 | head -80
            echo "신규 컨테이너 롤백"
            docker rm -f cookgenie-$NEW_COLOR
            exit 1
          fi

          # ── 5. Nginx upstream 업데이트 ──
          cat > $HOME/cookgenie-nginx/conf.d/upstream.conf << EOF
          upstream cookgenie_app {
              server cookgenie-$NEW_COLOR:8080;
          }
          EOF

          # Nginx 시작 또는 무중단 리로드 (hatoo/lineofduty의 nginx 컨테이너와 별개로 동작, 호스트 8082 포트 사용)
          if docker ps --filter "name=^/cookgenie-nginx$" --format "{{.Names}}" | grep -q "cookgenie-nginx"; then
            docker exec cookgenie-nginx nginx -s reload
            echo "✅ Nginx 리로드 완료 → cookgenie-$NEW_COLOR 로 트래픽 전환"
          else
            docker rm -f cookgenie-nginx 2>/dev/null || true
            docker run -d \
              --name cookgenie-nginx \
              --network cookgenie \
              -p 8082:80 \
              --restart always \
              -v $HOME/cookgenie-nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v $HOME/cookgenie-nginx/conf.d:/etc/nginx/conf.d:ro \
              nginx:alpine
            echo "✅ Nginx 최초 시작 완료 (호스트 포트 8082)"
          fi

          # ── 6. 구 컨테이너 Graceful Shutdown ──
          if [ -n "$ACTIVE_COLOR" ]; then
            echo "구 컨테이너(cookgenie-$ACTIVE_COLOR) Graceful Shutdown 중..."
            docker stop --time 30 cookgenie-$ACTIVE_COLOR
            docker rm cookgenie-$ACTIVE_COLOR
            echo "✅ 구 컨테이너 제거 완료"
          fi

          docker image prune -f
          echo "🚀 무중단 배포 완료! (활성: cookgenie-$NEW_COLOR, 접속: http://<서버IP>:8082)"
